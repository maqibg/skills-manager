name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build (for manual retries)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})
    # This fork ships Windows builds only, so the matrix has a single leg. A
    # healthy Windows build takes ~17 minutes; an hour caps a hang while leaving
    # real headroom.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          # Restore-only: the post-build cache *save* on Windows intermittently
          # fails (a lingering vctip.exe locks files in target/ while tar/zstd
          # packs the cache), marking an otherwise-successful release job red.
          # Release builds run rarely, so skipping the save avoids the false
          # failure at negligible cost. See v1.22.3 Windows-x64 run.
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Windows smoke check
        if: matrix.platform == 'windows-latest'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build CLI binary
        run: >-
          cargo build --release
          --manifest-path src-tauri/Cargo.toml
          --bin skills-manager-cli
          --target ${{ matrix.target }}

      - name: Extract changelog for current version
        id: changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BODY_EN=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md | awk -f scripts/strip-empty-sections.awk)
          BODY_ZH=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG-zh.md | awk -f scripts/strip-empty-sections.awk)
          # Release date: prefer the date on the CHANGELOG heading; fall back to today.
          RELEASE_DATE=$(grep -m1 "^## \[${VERSION}\] - " CHANGELOG.md | sed -E "s/^## \[${VERSION}\] - ([0-9-]+).*/\1/" || true)
          if [ -z "$RELEASE_DATE" ]; then RELEASE_DATE=$(date -u +%Y-%m-%d); fi
          # Previous tag for the commit range (skip the current tag itself).
          PREV_TAG=$(git tag --sort=-v:refname --merged "${RELEASE_TAG}" | grep -v "^${RELEASE_TAG}$" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${RELEASE_TAG}"
            RANGE_LINE="递交范围：[\`${PREV_TAG}...${RELEASE_TAG}\`](${COMPARE_URL})"
            RANGE_LINE_EN="Commit range: [\`${PREV_TAG}...${RELEASE_TAG}\`](${COMPARE_URL})"
            FULL_LINE="**完整变更**：[\`${PREV_TAG}...${RELEASE_TAG}\`](${COMPARE_URL})"
          else
            RANGE_LINE="递交范围：首个发布版本"
            RANGE_LINE_EN="Commit range: initial release"
            FULL_LINE="**完整变更**：首个发布版本"
          fi
          {
            echo "body<<EOF"
            echo "## Skills Manager ${RELEASE_TAG}"
            echo ""
            echo "发布日期：\`${RELEASE_DATE}\`"
            echo "${RANGE_LINE}"
            echo ""
            echo "$BODY_ZH"
            echo ""
            echo "### 当前校验状态"
            echo ""
            echo "- ✅ Windows x64 构建通过"
            echo "- ✅ TypeScript typecheck 通过"
            echo ""
            echo "---"
            echo ""
            echo "<details><summary>English release notes</summary>"
            echo ""
            echo "Release date: \`${RELEASE_DATE}\`"
            echo "${RANGE_LINE_EN}"
            echo ""
            echo "$BODY_EN"
            echo ""
            echo "### Current Verification"
            echo ""
            echo "- ✅ Windows x64 build passed"
            echo "- ✅ TypeScript typecheck passed"
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "${FULL_LINE}"
            echo ""
            echo "Full changelog files: [English](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) | [中文](https://github.com/${{ github.repository }}/blob/main/CHANGELOG-zh.md)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Skills Manager v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.body }}
          # Publish only after the build is verified: tauri-action creates the
          # release as a draft, and the publish-release job flips it public only
          # once verify-updater-assets passes.
          releaseDraft: true
          prerelease: false
          updaterJsonKeepUniversal: true
          args: --target ${{ matrix.target }}

      - name: Upload CLI binary to draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            CLI_PATH="src-tauri/target/${{ matrix.target }}/release/skills-manager-cli.exe"
            CLI_ASSET="skills-manager-cli-${{ matrix.label }}.exe"
          else
            CLI_PATH="src-tauri/target/${{ matrix.target }}/release/skills-manager-cli"
            CLI_ASSET="skills-manager-cli-${{ matrix.label }}"
          fi
          CLI_UPLOAD="$RUNNER_TEMP/$CLI_ASSET"
          cp "$CLI_PATH" "$CLI_UPLOAD"
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            "$CLI_UPLOAD" --clobber

  verify-updater-assets:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    name: Verify updater assets
    steps:
      - name: Validate updater metadata and signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          # The release is still a draft at this point, and /releases/tags/{tag}
          # returns 404 for drafts, so it has to be located by listing.
          releases_json=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases?per_page=100")

          release_json=$(echo "$releases_json" | jq --arg t "$TAG" '.[] | select(.tag_name == $t)')
          if [ -z "$release_json" ]; then
            echo "No release found for tag ${TAG}" >&2
            exit 1
          fi

          asset_names=$(echo "$release_json" | jq -r '.assets[]?.name')
          echo "Assets on the draft release:"
          echo "$asset_names" | sed 's/^/  /'

          if ! echo "$asset_names" | grep -qx 'latest.json'; then
            echo "Missing updater metadata asset: latest.json" >&2
            exit 1
          fi

          if ! echo "$asset_names" | grep -q '\.sig'; then
            echo "Missing updater signature assets (*.sig)" >&2
            exit 1
          fi

          fail=0
          for cli_asset in \
            skills-manager-cli-Windows-x64.exe; do
            if ! echo "$asset_names" | grep -qx "$cli_asset"; then
              echo "Missing CLI release asset: ${cli_asset}" >&2
              fail=1
            fi
          done

          # Draft assets are not served from the public download host, so fetch
          # latest.json through the authenticated asset endpoint.
          asset_id=$(echo "$release_json" | jq -r '.assets[] | select(.name == "latest.json") | .id')
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${REPO}/releases/assets/${asset_id}" -o /tmp/latest.json

          # v1.29.0 published with no entries for a platform that was actually
          # built, so the single updater target this fork ships is asserted here.
          for platform in windows-x86_64; do
            if ! jq -e --arg p "$platform" '.platforms[$p].signature and .platforms[$p].url' /tmp/latest.json >/dev/null; then
              echo "latest.json is missing a signed updater entry for ${platform}" >&2
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "--- latest.json ---" >&2
            cat /tmp/latest.json >&2
            exit 1
          fi

          echo "Updater assets validation passed"

  publish-release:
    needs: [build, verify-updater-assets]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Publish release
    steps:
      # Every build in the matrix finished and was verified by this point, so
      # this is the step that actually makes the release visible to users.
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false
          echo "Published ${{ github.ref_name }}"

      # skillsmanager.dev reads the version and download links from the GitHub
      # API behind an hourly ISR cache, so a low-traffic page can advertise the
      # previous release long after it shipped. Rebuilding on publish keeps the
      # site in step. The hook is optional, and a failed rebuild must not turn a
      # successful release red — the site catches up on its own within the hour.
      - name: Rebuild skillsmanager.dev
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -uo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set — skipping site rebuild."
            exit 0
          fi
          if curl -fsS -X POST "$HOOK" -o /dev/null; then
            echo "Triggered a skillsmanager.dev rebuild."
          else
            echo "::warning::Deploy hook failed; skillsmanager.dev will refresh on its own."
          fi
